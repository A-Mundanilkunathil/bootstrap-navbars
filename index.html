<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Navbars</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
</head>
<body>
  <!-- navbar 1, inspired by the boardroom kailua -->
  <div class="container-fluid px-0">
    <nav class="navbar navbar-expand-lg bg-gradient">
      <div class="container">
        <ul class="nav justify-content-start">
          <li class="nav-item">
            <a class="navbar-brand" href="#"><i class="bi bi-instagram"></i></a>
          </li>
        </ul>
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <a class="navbar-brand" href="#"><img src="board-room-logo.png" height="60" alt="The Boardroom logo"></a>
          </li>
        </ul>
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <button class="btn btn-dark">Menu</button>
          </li>
        </ul>
      </div>
    </nav>
  </div>
  <!-- navbar 2, inspired by morning brew -->
  <div>
    <nav class="navbar navbar-expand-lg bg-light">
      <div class="container py-2">
        <div class="mx-auto navbar-nav">
          <img src="morning-brew-logo.png" alt="Morning Brew logo">
        </div>
      </div>
    </nav>
    <div class="navbar navbar-expand-lg bg-light sticky-top">
      <div class="container">
        <div class="mx-auto navbar-nav">
          <div class="nav-item active border-3 border-1 border-top border-dark">Home</div>
          <div class="nav-item border-1 border-top border-dark">Order Online</div>
          <div class="nav-item border-1 border-top border-dark">Menus</div>
          <div class="nav-item border-1 border-top border-dark">Locations</div>
          <div class="nav-item border-1 border-top border-dark">About</div>
          <div class="nav-item border-1 border-top border-dark">Shop</div>
          <div class="nav-item border-1 border-top border-dark">Contact</div>
        </div>
      </div>
    </div>
  </div>
  <!-- navbar 3, inspired by buzzs -->
  <div class="container-fluid px-0 buzzs">
    <nav class="navbar navbar-expand-lg bg-gradient">
      <div class="container py-3">
        <ul class="nav justify-content-start">
          <li><h4 class="px-2">LUNCH</h4></li>
          <li><h4 class="px-2">DINNER</h4></li>
          <li><h4 class="px-2">DRINKS &amp; PUPU</h4></li>
        </ul>
        <ul class="nav justify-content-center">
          <li>
            <img src="buzzs-logo.png" height="70" alt="Buzzs logo">
          </li>
        </ul>
        <ul class="nav justify-content-end">
          <li><h4 class="px-2">ABOUT</h4></li>
          <li><h4 class="px-2">LOCATION</h4></li>
          <li><h4 class="px-2">SHOP</h4></li>
          <li><h4 class="px-2"><i class="bi bi-cart3"></i></h4></li>
        </ul>
      </div>
    </nav>
  </div>
  <!-- navbar 4, inspired by aloha beer -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="#"><img src="aloha-beer-logo.png" width="110" alt="Aloha Beer logo"></a>
      <div class="nav justify-content-center">
        <a class="nav-link" href="#">Locations &amp; Menus</a>
        <a class="nav-link" href="#">Events</a>
        <a class="nav-link" href="#">Brewery</a>
        <a class="nav-link" style="color: #EDC601;" href="#">Shop</a>
      </div>
      <div class="nav justify-content-end">
        <a class="nav-link" href="#">Account</a>
        <a class="nav-link" href="#">Search <i class="bi bi-search"></i></a>
        <a class="nav-link" href="#">Cart <i class="bi bi-cart3"></i></a>
      </div>
    </div>
  </nav>
  <!-- navbar 5, inspired by dukes waikiki -->
  <div class="container-fluid dukes">
    <nav class="navbar">
      <div class="container">
        <ul class="nav justify-content-start">
          <li>
            <a class="navbar-brand" href="#"><img src="dukes-logo.png" width="200" alt="Dukes Waikiki logo"></a>
          </li>
        </ul>
        <ul class="nav justify-content-end">
          <li><a class="nav-item nav-link" href="#">MENUS</a></li>
          <li><a class="nav-item nav-link" href="#">DUKE</a></li>
          <li><a class="nav-item nav-link" href="#">SHOP</a></li>
          <li><a class="nav-item nav-link" href="#">JOIN OUR TEAM</a></li>
          <li><a class="nav-item nav-link" href="#">CONTACT</a></li>
          <li><a class="nav-item nav-link" style="color: #F1A228;" href="#">ORDER TAKEOUT &amp; DELIVERY</a></li>
        </ul>
      </div>
    </nav>
  </div>
  <!-- used AI to help build the navbars and check them against the example -->
</body>
</html>
